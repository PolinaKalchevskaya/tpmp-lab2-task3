name: C Build and Test

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make

    - name: Build with Make
      run: make

    - name: Run program (optional)
      run: |
        echo "Build successful! Program is ready."
        # Для автоматического тестирования можно добавить ввод данных
        # echo -e "3\nAvatar\n20.05.2024\n19:30\n162\ncomedy\n237" | ./bin/cinema
